# Prometheus Configuration for Broker Synthetic Platform (Fase 1 / Fase 2)
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/phase2_alerts.yml"

scrape_configs:
  - job_name: 'broker-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000', 'host.docker.internal:3000']
        labels:
          environment: 'production-demo'
          tier: 'core-api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
