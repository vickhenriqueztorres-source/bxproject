services:
  postgres:
    image: postgres:16-alpine
    container_name: broker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broker_platform}
      POSTGRES_USER: ${POSTGRES_USER:-synth_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_pw_123}
    volumes:
      - broker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synth_migrator} -d ${POSTGRES_DB:-broker_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broker_net

  redis:
    image: redis:7-alpine
    container_name: broker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - broker_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - broker_net

  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - broker_keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - broker_net

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    container_name: broker-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--metrics-enabled=true"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret_123}
      KC_MANAGEMENT_PORT: 9000
    volumes:
      - ./keycloak/broker-realm.json:/opt/keycloak/data/import/broker-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - broker_net

  blnk-postgres:
    image: postgres:16-alpine
    container_name: broker-blnk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BLNK_POSTGRES_DB:-blnk_ledger}
      POSTGRES_USER: ${BLNK_POSTGRES_USER:-blnk_user}
      POSTGRES_PASSWORD: ${BLNK_POSTGRES_PASSWORD:-blnk_secret_123}
    volumes:
      - broker_blnk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLNK_POSTGRES_USER:-blnk_user} -d ${BLNK_POSTGRES_DB:-blnk_ledger}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - broker_net

  blnk:
    image: ghcr.io/blnkfinance/blnk:latest
    container_name: broker-blnk-core
    restart: unless-stopped
    depends_on:
      blnk-postgres:
        condition: service_healthy
    volumes:
      - ./blnk.json:/blnk.json
    ports:
      - "5001:5001"
    networks:
      - broker_net

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: broker-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - broker_net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: broker-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/phase2_alerts.yml:/etc/prometheus/phase2_alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - broker_net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: broker-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - broker_net

  loki:
    image: grafana/loki:3.0.0
    container_name: broker-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      - broker_net

networks:
  broker_net:
    driver: bridge

volumes:
  broker_postgres_data:
  broker_redis_data:
  broker_blnk_pg_data:
  broker_keycloak_pg_data:
