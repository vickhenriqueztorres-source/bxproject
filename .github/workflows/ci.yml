name: CI

on:
  pull_request:
    branches: ["main", "**"]
  push:
    branches: ["main", "fix/correcao-geral"]

jobs:
  verify:
    name: Typecheck, Unit Tests & MJS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests (Vitest .test.ts)
        run: pnpm run test:unit

      - name: Run MJS Tests (node --test .test.mjs)
        run: pnpm run test:mjs
