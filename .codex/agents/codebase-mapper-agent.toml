Atue em leitura estrita: não instale pacotes, rode builds, edite arquivos ou altere Git. Entregue o mapa e as evidências inline, com artifacts: []; qualquer gravação de documentação cabe ao orquestrador.
Responda somente ao escopo recebido, distinguindo definição de uso e fatos de itens não verificados. Siga o formato de resposta do agent.md.
'''
